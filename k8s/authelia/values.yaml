image:
  registry: ghcr.io
  repository: authelia/authelia
  tag: '4.39.19'

pod:
  kind: Deployment
  replicas: 2
  annotations:
    reloader.stakater.com/auto: "true"
  resources:
    requests:
      cpu: '100m'
      memory: '64Mi'
    limits:
      memory: '256Mi'

  extraVolumeMounts:
    - name: users-database
      mountPath: /config/users_database.yml
      subPath: users_database.yml
      readOnly: true
  extraVolumes:
    - name: users-database
      secret:
        secretName: authelia-users
        items:
          - key: users_database.yml
            path: users_database.yml

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

configMap:
  server:
    port: 9091

  log:
    level: 'info'
    format: 'json'

  telemetry:
    metrics:
      enabled: false   # Prometheus 連携時は true + 別 Service / ServiceMonitor

  ntp:
    disable_startup_check: true

  totp:
    issuer: 'yadon3141.com'

  webauthn:
    enable_passkey_login: true
    display_name: 'yadon3141'

  identity_validation:
    reset_password:
      jwt_lifespan: '5 minutes'
      jwt_algorithm: 'HS256'
      secret:
        secret_name: ~
        path: 'identity_validation.reset_password.jwt.hmac.key'

  authentication_backend:
    refresh_interval: '5 minutes'
    file:
      enabled: true
      path: '/config/users_database.yml'
      watch: true
      password:
        algorithm: 'argon2'

  access_control:
    default_policy: 'deny'
    rules:
      - domain: 'auth.yadon3141.com'
        policy: 'bypass'
      - domain: 'grafana.yadon3141.com'
        policy: 'one_factor'
        subject: 'group:dev'
      - domain: 'proxmox.yadon3141.com'
        policy: 'one_factor'
        subject: 'group:dev'
    
  session:
    name: 'authelia_session'
    same_site: 'lax'
    expiration: '1 hour'
    inactivity: '5 minutes'
    remember_me: '1 month'
    encryption_key:
      secret_name: ~   # path: session.encryption.key
    cookies:
      - domain: 'yadon3141.com'
        subdomain: 'auth'
        default_redirection_url: 'https://yadon3141.com'
    redis:
      enabled: true
      host: 'valkey.valkey.svc.cluster.local'
      port: 6379
      username: 'authelia'
      database_index: 0
      password:
        secret_name: ~
        path: 'session.redis.password.txt'

  regulation:
    modes:
      - 'user'
    max_retries: 3
    find_time: '2 minutes'
    ban_time: '5 minutes'

  storage:
    encryption_key:
      secret_name: ~
      path: 'storage.encryption.key'
    postgres:
      enabled: true
      address: 'tcp://pg-shared-rw.postgres.svc.cluster.local:5432'
      database: 'authelia'
      username: 'authelia'
      password:
        secret_name: ~
        path: 'storage.postgres.password.txt'

  notifier:
    disable_startup_check: false
    filesystem:
      enabled: true
      filename: '/config/notification.txt'

secret:
  existingSecret: 'authelia-secrets'
  mountPath: '/secrets'

persistence:
  enabled: false
