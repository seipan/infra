apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia-ingress
  namespace: authelia
spec:
  ingressClassName: traefik 
  rules:
    - host: auth.yadon3141.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia              
                port:
                  number: 80
