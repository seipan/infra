apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cilium

resources:
  - l2-policy.yaml
  - lb-pool.yaml
  - namespace.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.19.0
    releaseName: cilium
    namespace: cilium
    valuesFile: values.yaml