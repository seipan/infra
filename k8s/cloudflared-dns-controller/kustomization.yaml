apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudflared

resources:
  - external-secret.yaml

helmCharts:
  - name: cloudflared-dns-controller
    repo: https://seipan.github.io/cloudflared-dns-controller
    version: 0.2.1
    releaseName: cloudflared-dns-controller
    namespace: cloudflared
    valuesFile: values.yaml