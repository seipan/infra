apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: grafana
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.yadon3141.com`)
      kind: Rule
      services:
        - name: grafana
          port: 80
      middlewares:
        - name: authelia-auth
          namespace: authelia
