apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

resources:
  - ingress.yaml
  - external-secret.yaml

helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 12.3.0
    releaseName: grafana
    namespace: grafana
    valuesFile: values.yaml
