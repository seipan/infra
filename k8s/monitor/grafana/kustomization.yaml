apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

generators:
  - ksops-generator.yaml

helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 1.10.0
    releaseName: grafana
    namespace: grafana
    valuesFile: values.yaml
