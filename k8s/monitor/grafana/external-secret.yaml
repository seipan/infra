---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin/admin-user
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin/admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-db
    creationPolicy: Owner
  data:
    - secretKey: GF_DATABASE_USER
      remoteRef:
        key: grafana-db/GF_DATABASE_USER
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: grafana-db/GF_DATABASE_PASSWORD
