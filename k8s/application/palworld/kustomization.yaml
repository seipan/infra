apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: palworld

helmCharts:
- name: palworld
  repo: https://twinki14.github.io/palworld-server-chart
  version: 2.7.1
  releaseName: palworld
  namespace: palworld
  valuesFile: values.yaml

resources:
- namespace.yaml
- external-secret.yaml
- storageclass.yaml
- playit-agent.yaml

patches:
- target:
    kind: Deployment
    name: palworld-server
  patch: |-
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - prd-w3
# Pin the ClusterIP too - the playit.gg tunnel's "Local IP" is configured
# in playit's dashboard (outside this repo) against this exact address, so
# it needs to stay stable across any Service recreate, same reasoning as
# the LB IP pin in values.yaml.
- target:
    kind: Service
    name: palworld-svc
  patch: |-
    - op: add
      path: /spec/clusterIP
      value: 10.110.104.151
