# Traefik Ingress (ingress.yaml) と併走させる検証用の HTTPRoute。
# cloudflared は引き続き traefik を向いているため、本番トラフィックには影響しない。
# 検証は Gateway の LB IP を直接叩いて行う:
#   curl -H 'Host: blog.yadon3141.com' http://192.168.0.172/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: static-server
  namespace: default
spec:
  parentRefs:
    - name: main
      namespace: gateway
      sectionName: http
  hostnames:
    - blog.yadon3141.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: static-server
          port: 80
