apiVersion: v1
kind: Service
metadata:
  name: proxmox-api
  namespace: proxmox
spec:
  ports:
    - name: https
      port: 8006
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-api-nodes
  namespace: proxmox
  labels:
    kubernetes.io/service-name: proxmox-api
addressType: IPv4
endpoints:
  - addresses: ["192.168.0.11"] # prox1
  - addresses: ["192.168.0.12"] # prox2
  - addresses: ["192.168.0.13"] # prox3
ports:
  - name: https
    port: 8006
    protocol: TCP
